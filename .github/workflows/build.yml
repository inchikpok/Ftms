name: Build APK

'on':
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # [ФИКС] Пароль больше не хардкодится, берётся из GitHub Secrets.
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS=app/keystore/treadmill.keystore
          if [ ! -f "$KS" ]; then
            echo "::error::Keystore file $KS not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$KS")
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Keystore looks corrupt (size=$SIZE bytes)"
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            || { echo "::error::Keystore cannot be read (wrong secret KEYSTORE_PASSWORD / KEY_ALIAS?)"; exit 1; }
          echo "Keystore fingerprint (must be constant):"
          keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:" || true

      - name: Inject version code
        run: |
          NEW_CODE=$((${{ github.run_number }} + 10000))
          sed -i "s/versionCode = .*/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"2.0.${{ github.run_number }}\"/" app/build.gradle.kts

      # [ФИКС] Собираем release, а не debug. Пароли пробрасываем в env для Gradle.
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --no-configuration-cache

      # [ФИКС] Обязательная проверка подписи: если не прошла — билд падает.
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          BT=$(ls -d "${ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ] || [ ! -x "${BT}/apksigner" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          "${BT}/apksigner" verify --print-certs "$APK" \
            || { echo "::error::APK signature verification FAILED"; exit 1; }
          echo "--- apksigner verify OK ---"

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: treadmill-release-apk
          path: artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk
          retention-days: 1
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Treadmill Control ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
          body: |
            Автосборка из коммита ${{ github.sha }}.
            Скачайте `.apk` ниже и откройте на телефоне.
          files: artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
