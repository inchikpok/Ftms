name: 'Delete old workflow runs'
on:
  schedule:
    - cron: '0 0 1 * *' # Запуск 1-го числа каждого месяца в 00:00
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: iamazeem/delete-workflow-runs-action@v1
        with:
          keep: 5 # Оставить 5 последних запусков для каждого workflow
